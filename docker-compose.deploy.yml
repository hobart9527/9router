services:
  9router:
    build:
      context: .
      dockerfile: Dockerfile
    image: 9router-fork:0.5.109-124a31eb
    container_name: 9router
    restart: unless-stopped
    ports:
      - 20128:20128
    volumes:
      - /opt/9router/data:/app/data
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      PORT: 20128
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
